# Publishes this package to bats-lang/repository-prototype when src/ or
# bats.toml changes on main. See PUBLISHING-SETUP.md there. Called by
# commit, which the daily relock moves (bats-lang/repository-prototype#269).
name: publish
on:
  push:
    branches: [main]
    paths: ['src/**', 'bats.toml']
jobs:
  publish:
    uses: bats-lang/repository-prototype/.github/workflows/publish.yml@f7c08d40621f70f8190f8e6b71bb5d7ef4e88708 # repository-prototype main f7c08d4
    secrets: inherit
