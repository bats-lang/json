# Publishes this package to bats-lang/repository-prototype when src/ or
# bats.toml changes on main. See PUBLISHING-SETUP.md there. Called by
# commit, which the daily relock moves (bats-lang/repository-prototype#269).
name: publish
on:
  push:
    branches: [main]
    paths: ['src/**', 'bats.toml']
jobs:
  publish:
    uses: bats-lang/repository-prototype/.github/workflows/publish.yml@0ba6bd597466307d9feed6c6e8362e10c9206aa4 # repository-prototype main 0ba6bd5
    secrets: inherit
