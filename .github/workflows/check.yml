name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The daily relock dispatches it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ATS2
        run: |
          curl -sL "https://raw.githubusercontent.com/ats-lang/ats-lang.github.io/master/FROZEN000/ATS-Postiats/ATS2-Postiats-int-0.4.2.tgz" -o /tmp/ats2.tgz
          mkdir -p ~/.ats2
          tar -xzf /tmp/ats2.tgz -C ~/.ats2
          cd ~/.ats2/ATS2-Postiats-int-0.4.2
          make -j$(nproc) -C src/CBOOT patsopt
          mkdir -p bin
          cp src/CBOOT/patsopt bin/patsopt
          mkdir -p ~/.bats
          ln -sf ~/.ats2/ATS2-Postiats-int-0.4.2 ~/.bats/ats2

      # The compiler at the commit .github/bats-version pins (bats-lang/repository-prototype#269)
      - name: Read the compiler pin
        id: pins
        run: echo "bats=$(tr -d '[:space:]' < .github/bats-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout bats compiler
        uses: actions/checkout@v4
        with:
          repository: bats-lang/bats
          ref: ${{ steps.pins.outputs.bats }}
          path: bats-src

      - name: Build bats from checked-in bootstrap C
        run: |
          cp -R bats-src/bootstrap/c ~/bats-c
          make -j$(nproc) -C ~/bats-c PATSHOME=$HOME/.ats2/ATS2-Postiats-int-0.4.2 debug/bats
          mkdir -p ~/bats-bin
          cp ~/bats-c/debug/bats ~/bats-bin/bats
          rm -rf bats-src

      - name: bats check
        run: |
          export PATH=~/bats-bin:$PATH
          # The package repository at the commit .github/repository-version pins
          # (bats-lang/repository-prototype#269): what the lock and the test packages resolve against
          git init -q ~/repository
          git -C ~/repository fetch -q --depth 1 https://github.com/bats-lang/repository-prototype.git "$(tr -d '[:space:]' < .github/repository-version)"
          git -C ~/repository checkout -q FETCH_HEAD
          # The committed lock (bats-lang/repository-prototype#269): never relocked here
          test -f bats.lock || { echo "::error::bats.lock is missing: run 'bats lock --repository <dir>' and commit it"; exit 1; }
          bats check --repository ~/repository

      - name: Unit tests
        run: |
          export PATH=~/bats-bin:$PATH
          bats test --repository ~/repository

      - name: Dynamic tests
        run: |
          sudo apt-get install -y valgrind
          export PATH=~/bats-bin:$PATH
          tests/dynamic/run.sh ~/repository
